<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastAPI Calculator</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="stylesheet" href="/static/css/planner.css" />
</head>
<body>
  <nav class="planner-nav" style="font-family:Inter,system-ui,sans-serif">
    <a href="/" class="active">Calculator</a>
    <a href="/planner">Planner</a>
  </nav>
  <main class="calculator-app" style="margin-top:24px">
    <header>
      <h1>Calculator</h1>
      <p>FastAPI-powered calculator UI with JSON API backend.</p>
    </header>

    <section class="display-panel">
      <input id="expression" type="text" placeholder="Enter expression" readonly />
      <div id="result" class="result">0</div>
    </section>

    <section class="button-grid" aria-label="Calculator keypad">
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="/">÷</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="*">×</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="-">−</button>

      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button id="clear">C</button>
      <button data-value="+">+</button>

      <button id="backspace">⌫</button>
      <button data-value="(">(</button>
      <button data-value=")">)</button>
      <button id="equals">=</button>
    </section>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
